# ============================================================
# PostgreSQL local para desarrollo + Adminer (interfaz visual)
# ============================================================
# Iniciar:   docker compose up -d
# Detener:   docker compose down
# Ver logs:  docker compose logs -f db
# Conectar:  docker compose exec db psql -U dental_user -d dental_day_db
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: dental_day_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dental_day_db
      POSTGRES_USER:     dental_user
      POSTGRES_PASSWORD: dental_pass
    ports:
      - "5432:5432"
    volumes:
      - dental_day_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental_user -d dental_day_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz visual para explorar la BD en el navegador — opcional pero útil
  adminer:
    image: adminer:latest
    container_name: dental_day_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dental_day_data:
    name: dental_day_postgres_data
